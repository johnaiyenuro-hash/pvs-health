<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Loss Vision 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f2ee;
    --card: #ffffff;
    --ink: #1c1917;
    --ink2: #57534e;
    --ink3: #a8a29e;
    --accent: #c84b2f;
    --accent2: #2563eb;
    --accent3: #16a34a;
    --border: #e7e5e4;
    --tag-p: #eff6ff; --tag-p-fg: #1d4ed8;
    --tag-c: #fff7ed; --tag-c-fg: #c2410c;
    --tag-f: #f0fdf4; --tag-f-fg: #15803d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; line-height: 1.5; }

  /* Layout */
  .hero { padding: 40px 24px 28px; max-width: 800px; margin: 0 auto; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 10px; }
  .hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(32px, 8vw, 56px); font-weight: 800; line-height: 0.9; margin-bottom: 16px; }
  .hero h1 span { color: var(--accent); }

  .tabs-wrap { max-width: 800px; margin: 0 auto; padding: 0 24px; position: sticky; top: 0; background: var(--bg); z-index: 100; padding-top: 10px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 10px 20px; border-radius: 40px; border: 1.5px solid var(--border); font-size: 13px; cursor: pointer; background: white; font-weight: 600; transition: 0.2s; white-space: nowrap; }
  .tab.active { background: var(--ink); color: white; border-color: var(--ink); }

  .content { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
  .panel { display: none; animation: fadeIn 0.3s ease-out; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card { background: white; border-radius: 20px; border: 1.5px solid var(--border); padding: 24px; margin-bottom: 20px; }
  .card h3 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  /* Progress & Stats */
  .progress-bar { height: 8px; background: var(--border); border-radius: 10px; margin: 10px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent3); width: 0%; transition: 0.4s; }

  /* Workout Accordion */
  .day-card { background: white; border-radius: 16px; border: 1.5px solid var(--border); margin-bottom: 12px; overflow: hidden; }
  .day-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .day-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border); background: #fafaf9; }
  .day-body.open { display: block; }
  .ex-list { list-style: none; font-size: 13px; color: var(--ink2); }
  .ex-list li { padding: 4px 0; border-bottom: 1px solid #eee; }

  /* Nutrition Randomizer */
  .shuffle-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
  .btn-shuffle { background: var(--ink); color: white; border: none; padding: 8px 14px; border-radius: 30px; font-size: 11px; font-weight: 700; cursor: pointer; }
  .tag { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .tag.p { background: var(--tag-p); color: var(--tag-p-fg); }

  /* Water Tracker */
  .water-grid { display: flex; gap: 10px; align-items: center; justify-content: center; background: #eff6ff; padding: 20px; border-radius: 15px; }
  .water-btn { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--accent2); color: white; font-size: 20px; cursor: pointer; }
  .water-count { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--accent2); }

  /* Mirror Log */
  .log-item { display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid var(--border); }
  .log-img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #eee; cursor: pointer; }
  .weight-input-group { display: flex; flex-direction: column; gap: 12px; }
  .file-label { display: block; padding: 12px; background: #fff; border: 1.5px dashed var(--ink3); border-radius: 10px; text-align: center; cursor: pointer; font-size: 13px; }
  input[type="file"] { position: absolute; opacity: 0; width: 1px; }
  .btn-add { background: var(--accent); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 800; cursor: pointer; }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; justify-content: center; align-items: center; }
  .modal img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
</style>
</head>
<body>

<div id="photoModal" class="modal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

<div class="hero">
  <div class="hero-eyebrow">Vision 2026</div>
  <h1>Level Up<br><span>Fitness</span></h1>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab active" onclick="showTab('dashboard', this)">Dash</div>
    <div class="tab" onclick="showTab('nutrition', this)">Meals</div>
    <div class="tab" onclick="showTab('workout', this)">Workout</div>
    <div class="tab" onclick="showTab('water', this)">Water</div>
    <div class="tab" onclick="showTab('pushups', this)">Push-Ups</div>
    <div class="tab" onclick="showTab('log', this)">Mirror Log</div>
  </div>
</div>

<div class="content">
  
  <!-- DASHBOARD -->
  <div class="panel active" id="dashboard">
    <div class="card">
      <h3>🎯 10kg Progress</h3>
      <div class="progress-bar"><div class="progress-fill" id="weightProgress"></div></div>
      <p id="weightStatus" style="font-size: 13px; color: var(--ink2);">Log weight to begin.</p>
    </div>
    <div id="latestPhotoPreview" class="card" style="padding: 10px; display: none; text-align: center;">
        <p style="font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px;">Latest Transformation</p>
        <img id="dashImg" style="width: 100%; border-radius: 12px;">
    </div>
  </div>

  <!-- NUTRITION -->
  <div class="panel" id="nutrition">
    <div class="card">
      <div class="shuffle-container">
        <h3>🥗 Meal Randomizer</h3>
        <button class="btn-shuffle" onclick="randomizeAll()">🎲 Shuffle</button>
      </div>
      <div id="mealList"></div>
    </div>
  </div>

  <!-- WORKOUT -->
  <div class="panel" id="workout">
    <div id="workoutList"></div>
  </div>

  <!-- WATER -->
  <div class="panel" id="water">
    <div class="card" style="text-align: center;">
      <h3>💧 Daily Hydration</h3>
      <p style="font-size: 12px; color: var(--ink2); margin-bottom: 20px;">Aim for 3L (12 glasses)</p>
      <div class="water-grid">
        <button class="water-btn" onclick="addWater(-1)">-</button>
        <div class="water-count" id="waterDisplay">0</div>
        <button class="water-btn" onclick="addWater(1)">+</button>
      </div>
      <button onclick="resetWater()" style="margin-top:15px; border:none; background:none; color:var(--ink3); font-size:11px; text-decoration:underline; cursor:pointer;">Reset Daily</button>
    </div>
  </div>

  <!-- PUSH-UPS -->
  <div class="panel" id="pushups">
    <div class="card">
      <h3>💪 Push-Up Challenge</h3>
      <div id="puGrid" style="display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;"></div>
    </div>
  </div>

  <!-- MIRROR LOG -->
  <div class="panel" id="log">
    <div class="card">
      <h3>⚖️ Weekly Check-in</h3>
      <div class="weight-input-group">
        <input type="number" id="weightInput" step="0.1" placeholder="Current weight (kg)" style="padding: 12px; border-radius: 10px; border: 1.5px solid var(--border);">
        <label for="photoInput" class="file-label" id="fileLabel">📸 Add Mirror Selfie</label>
        <input type="file" id="photoInput" accept="image/*" onchange="handleFile(this)">
        <button class="btn-add" onclick="saveEntry()">SAVE LOG ENTRY</button>
      </div>
      <div id="logHistory" style="margin-top: 20px;"></div>
    </div>
  </div>

</div>

<script>
// --- DATA POOLS ---
const meals = {
  breakfast: [
    { name: "Protein Power Oats", desc: "Oats, whey, 1tbsp peanut butter, berries.", tags: ["40g P"] },
    { name: "Egg White Scramble", desc: "3 whites, 1 whole egg, spinach, feta, rye toast.", tags: ["30g P"] },
    { name: "Greek Yogurt Bowl", desc: "0% Greek yogurt, chia seeds, 10 almonds.", tags: ["25g P"] },
    { name: "Cottage Cheese Toast", desc: "Low fat cottage cheese, cucumber, chili flakes.", tags: ["22g P"] },
    { name: "Protein Pancakes", desc: "Banana, 1 egg, 1 scoop whey mashed & fried.", tags: ["35g P"] }
  ],
  lunch: [
    { name: "Quinoa Chicken Bowl", desc: "Grilled chicken, quinoa, cucumber, hummus.", tags: ["35g P"] },
    { name: "Tuna Salad Wrap", desc: "Tuna, greek yogurt, celery, wholewheat wrap.", tags: ["40g P"] },
    { name: "Lean Beef Stir Fry", desc: "Beef strips, broccoli, soy, ginger, cauliflower rice.", tags: ["30g P"] },
    { name: "Turkey Apple Salad", desc: "Sliced turkey, greens, apple slices, walnuts.", tags: ["32g P"] },
    { name: "Lentil & Bacon Soup", desc: "Red lentils, lean bacon bits, carrots, onion.", tags: ["25g P"] }
  ],
  dinner: [
    { name: "Salmon & Asparagus", desc: "Baked salmon, asparagus, lemon, half sweet potato.", tags: ["30g P"] },
    { name: "Pesto Zucchini Noodles", desc: "Zoodles, grilled chicken, cherry tomatoes, light pesto.", tags: ["35g P"] },
    { name: "Lean Turkey Chili", desc: "Ground turkey, kidney beans, peppers, onions.", tags: ["40g P"] },
    { name: "Steak & Green Beans", desc: "Lean sirloin, garlic green beans, side salad.", tags: ["38g P"] },
    { name: "Cod Papillote", desc: "White fish baked in paper with Mediterranean veggies.", tags: ["28g P"] }
  ]
};

const workouts = [
  { day: "Monday", focus: "Upper Body", ex: ["Push-ups: 3x15", "Bag Rows: 3x12", "Bench Dips: 3x12", "Plank: 3x60s"] },
  { day: "Tuesday", focus: "Legs + Run", ex: ["Squats: 3x20", "Lunges: 3x12/side", "Calf Raises: 3x20", "2km Steady Run"] },
  { day: "Wednesday", focus: "Core + HIIT", ex: ["Russian Twists: 3x20", "Mountain Climbers: 4x45s", "Leg Raises: 3x12", "Burpees: 3x10"] },
  { day: "Thursday", focus: "Push + Shoulders", ex: ["Pike Push-ups: 3x10", "Shoulder Taps: 3x20", "Diamond Push-ups: 3xMax"] },
  { day: "Friday", focus: "Full Body", ex: ["Squat to Press: 3x15", "Bicep Curls (Bag): 3x12", "High Knees: 4x45s", "Superman: 3x12"] },
  { day: "Saturday", focus: "Active Recovery", ex: ["6k Walk", "Long Stretch Session", "Hip Mobility"] },
  { day: "Sunday", focus: "Rest & Prep", ex: ["Meal Prep", "Check Calorie Logs", "Relax"] }
];

const puSchedule = [10,12,15,0,18,20,22,0,25,28,30,0,32,35,40,0,45,50,55,60,75];

// --- APP LOGIC ---
let weightLogs = JSON.parse(localStorage.getItem('v26_logs') || '[]');
let currentPhotoBase64 = "";
let waterCount = parseInt(localStorage.getItem('v26_water') || '0');

function showTab(id, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  el.classList.add('active');
}

// Randomizer
function randomizeAll() {
  const container = document.getElementById('mealList'); container.innerHTML = '';
  ['breakfast', 'lunch', 'dinner'].forEach(cat => {
    const item = meals[cat][Math.floor(Math.random() * meals[cat].length)];
    container.innerHTML += `
      <div style="margin-bottom:15px; padding:15px; background:#fafaf9; border-radius:12px; border-left:4px solid var(--accent);">
        <div style="font-size:10px; font-weight:800; text-transform:uppercase; color:var(--ink3);">${cat}</div>
        <div style="font-family:'Syne', sans-serif; font-weight:700;">${item.name}</div>
        <p style="font-size:12px; color:var(--ink2);">${item.desc}</p>
        <span class="tag p">${item.tags[0]}</span>
      </div>`;
  });
}

// Workouts
const workoutList = document.getElementById('workoutList');
workouts.forEach(w => {
  workoutList.innerHTML += `
    <div class="day-card">
      <div class="day-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <div><div style="font-weight:700;">${w.day}</div><div style="font-size:11px;color:var(--accent);">${w.focus}</div></div>
        <span>▼</span>
      </div>
      <div class="day-body"><ul class="ex-list">${w.ex.map(e => `<li>${e}</li>`).join('')}</ul></div>
    </div>`;
});

// Water
function addWater(val) {
  waterCount = Math.max(0, waterCount + val);
  document.getElementById('waterDisplay').textContent = waterCount;
  localStorage.setItem('v26_water', waterCount);
}
function resetWater() { waterCount = 0; addWater(0); }

// Photos & Logs
function handleFile(input) {
  const file = input.files[0]; if (!file) return;
  document.getElementById('fileLabel').textContent = "✅ Photo Attached";
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 400; const scale = MAX_WIDTH / img.width;
      canvas.width = MAX_WIDTH; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      currentPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function saveEntry() {
  const wInput = document.getElementById('weightInput');
  if (!wInput.value) return alert("Enter weight");
  weightLogs.unshift({ date: new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short'}), kg: parseFloat(wInput.value), img: currentPhotoBase64 });
  localStorage.setItem('v26_logs', JSON.stringify(weightLogs));
  wInput.value = ''; currentPhotoBase64 = ''; document.getElementById('fileLabel').textContent = "📸 Add Mirror Selfie";
  renderLog(); updateProgress();
}

function renderLog() {
  const hist = document.getElementById('logHistory'); hist.innerHTML = '';
  weightLogs.forEach((log, index) => {
    hist.innerHTML += `
      <div class="log-item">
        <img src="${log.img || ''}" class="log-img" onclick="openModal('${log.img}')" onerror="this.style.display='none'">
        <div><div style="font-size:11px; color:var(--ink3);">${log.date}</div><div style="font-weight:800;">${log.kg} kg</div></div>
        <button onclick="deleteLog(${index})" style="border:none; background:none; cursor:pointer;">×</button>
      </div>`;
  });
  if(weightLogs[0]?.img) {
    document.getElementById('latestPhotoPreview').style.display = 'block';
    document.getElementById('dashImg').src = weightLogs[0].img;
  }
}

function deleteLog(i) { weightLogs.splice(i,1); localStorage.setItem('v26_logs', JSON.stringify(weightLogs)); renderLog(); updateProgress(); }
function openModal(src) { document.getElementById('photoModal').style.display = 'flex'; document.getElementById('modalImg').src = src; }

function updateProgress() {
  if(weightLogs.length < 1) return;
  const diff = (weightLogs[weightLogs.length-1].kg - weightLogs[0].kg).toFixed(1);
  const percent = Math.min(Math.max((diff / 10) * 100, 0), 100);
  document.getElementById('weightProgress').style.width = percent + '%';
  document.getElementById('weightStatus').textContent = `${diff}kg lost of 10kg goal.`;
}

// Push Ups
let puData = JSON.parse(localStorage.getItem('v26_pu') || '[]');
function renderPU() {
  const grid = document.getElementById('puGrid'); grid.innerHTML = '';
  puSchedule.forEach((reps, i) => {
    const isDone = puData.includes(i);
    const cell = document.createElement('div');
    cell.style = `aspect-ratio:1; background:${isDone?'var(--ink)':'white'}; color:${isDone?'white':'var(--ink)'}; border:1.5px solid var(--border); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:12px;`;
    cell.innerHTML = reps === 0 ? '☕' : `<span style="font-size:8px; opacity:0.5">${i+1}</span><strong>${reps}</strong>`;
    cell.onclick = () => {
      if(puData.includes(i)) puData = puData.filter(d => d !== i); else puData.push(i);
      localStorage.setItem('v26_pu', JSON.stringify(puData)); renderPU();
    };
    grid.appendChild(cell);
  });
}

// Init
randomizeAll(); renderLog(); renderPU(); updateProgress(); resetWater();
</script>
</body>
</html>
